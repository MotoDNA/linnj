<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linn &amp; J 홈페이지 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;400&display=swap">
<style>
@property --a1{syntax:'<number>';inherits:false;initial-value:0}
@property --a2{syntax:'<number>';inherits:false;initial-value:0}
@property --a3{syntax:'<number>';inherits:false;initial-value:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;font-family:'Noto Serif KR',serif;font-weight:300;color:#1C1A18;background:#F2F0EB}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
.vis-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{padding:0 clamp(20px,4vw,48px)}
.tap{display:inline-flex;align-items:center;min-height:44px}
.lj-hl{outline:3px solid #E8730C;outline-offset:4px}

/* ---------- landing ---------- */
.landing{min-height:100vh;padding:clamp(32px,6vw,72px) clamp(20px,5vw,64px)}
.landing h1{margin:0;font-size:clamp(30px,4vw,48px);font-weight:300;letter-spacing:.02em}
.landing .sub{margin:12px 0 0;color:#6B6358;font-size:15px}
.cards{margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
.card{display:flex;flex-direction:column;text-decoration:none;background:#FFFFFF;border:1px solid #DDD6CB}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover}
.card .cb{flex:1;display:flex;flex-direction:column;align-items:flex-start;padding:22px 22px 26px}
.card .k{font-size:13px;letter-spacing:.2em;color:#6B6358}
.card .t{margin-top:8px;font-size:26px}
.card .d{margin:10px 0 18px;font-size:14px;line-height:1.8;color:#4A453F}
.card .go{margin-top:auto;display:inline-flex;align-items:center;min-height:44px;padding:0 22px;background:#1C1A18;color:#F2F0EB;font-size:13px;letter-spacing:.14em}
.howto{margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;font-size:14px;line-height:1.8;color:#4A453F}
.howto div{border-top:1px solid #CFC7BB;padding-top:14px}
.howto b{font-weight:400;color:#1C1A18}

/* ---------- 상담 알림 예시 (메신저 화면) ---------- */
.ntf{max-width:400px;background:#E7E3DC;border-radius:16px;padding:16px 14px 20px;font-family:'Noto Sans KR',sans-serif;font-weight:300;color:#1C1A18;text-align:left;line-height:1.6}
.ntf .top{display:flex;align-items:center;gap:10px;padding:0 2px 12px;font-size:15px;font-weight:400}
.ntf .top small{margin-left:auto;font-size:12px;font-weight:300;color:#6B6358}
.ntf .day{text-align:center;font-size:12px;color:#6B6358;margin:0 0 12px}
.ntf .msg{display:flex;gap:8px;align-items:flex-start}
.ntf .av{flex:none;width:38px;height:38px;border-radius:14px;background:#1C1A18;color:#F2F0EB;display:flex;align-items:center;justify-content:center}
.ntf .who{font-size:12px;color:#4A453F;margin:0 0 4px}
.ntf .bub{background:#FFFFFF;border-radius:14px;overflow:hidden}
.ntf .tag{background:#F1E3C4;color:#5A4520;font-size:12px;padding:7px 14px}
.ntf .in{padding:14px}
.ntf h3{margin:0 0 2px;font-size:15px;font-weight:400}
.ntf .lead{margin:0 0 10px;font-size:13px;color:#4A453F}
.ntf dl{margin:0;display:grid;grid-template-columns:76px minmax(0,1fr);gap:6px 0;font-size:13px}
.ntf dt{color:#6B6358}
.ntf dd{margin:0;overflow-wrap:anywhere}
.ntf .meta{margin:10px 0 12px;font-size:12px;color:#6B6358}
.ntf .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ntf .acts span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #CFC7BB;border-radius:8px;font-size:13px}
.ntf .time{margin:4px 0 0 2px;font-size:11px;color:#6B6358}
.ntfwrap{display:flex;flex-wrap:wrap;gap:32px 48px;align-items:flex-start}
.ntfwrap .how{flex:1 1 280px;max-width:520px;font-size:15px;line-height:1.9;color:#4A453F}
.ntfwrap .how ol{margin:12px 0 0;padding-left:20px}
.ntfwrap .how b{font-weight:400;color:#1C1A18}

/* ---------- 유튜브 버튼 · About · Process ---------- */
.ytb{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 22px;border:1px solid currentColor;border-radius:23px;text-decoration:none;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:400;white-space:nowrap;transition:opacity .3s}
.ytb:hover{opacity:.6}
.abt,.proc,.facts{word-break:keep-all}
.abt{display:flex;flex-wrap:wrap;gap:32px 72px;margin-top:32px}
.abt .l{flex:1 1 320px}
.abt .r{flex:1.4 1 420px;max-width:760px}
.abt .lead{margin:0;font-size:clamp(24px,2.8vw,38px);line-height:1.5;font-weight:300}
.abt .r p{margin:0;font-size:16px;line-height:2}
.abt .who{margin-top:28px !important;font-size:15px !important}
.facts{margin:28px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:0 32px}
.facts>div{padding:14px 0;border-top:1px solid;border-color:rgba(128,128,128,.35)}
.facts dt{font-size:12px;letter-spacing:.14em;opacity:.6}
.facts dd{margin:6px 0 0;font-size:15px}
.proc{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:36px 40px}
.proc .no{font-family:'Noto Serif KR',serif;font-size:36px;font-weight:300;opacity:.4}
.proc .t{margin-top:8px;font-size:18px;font-weight:400}
.proc p{margin:10px 0 0;font-size:14px;line-height:1.9}

/* ---------- back to list ---------- */
.back{position:fixed;left:16px;bottom:16px;z-index:50;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;background:rgba(28,26,24,.88);color:#F2F0EB;text-decoration:none;font-family:'Noto Sans KR',sans-serif;font-size:13px}
.back:hover{background:#1C1A18;color:#FFFFFF}

/* ---------- light on/off ---------- */
.lt{position:relative;overflow:hidden;background:#111;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.lt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.lt .on-img{opacity:0;transition:opacity .9s ease}
.lt.on .on-img{opacity:1}
.lt.pin .on-img{opacity:1}
.lt .bulb{position:absolute;right:7px;bottom:7px;z-index:3;width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lt .bulb i{width:30px;height:30px;border-radius:15px;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:background .4s,transform .3s}
.lt .bulb:hover i{transform:scale(1.12)}
.lt .bulb:focus-visible{outline:2px solid #F1E3C4;outline-offset:-4px;border-radius:22px}
.lt.on .bulb i{background:rgba(255,236,200,.85)}
.lt.on .bulb svg{stroke:#1C1A18}
.lt.pin .bulb i{background:#FFE9BF}
.lt.pin .bulb svg{stroke:#1C1A18}

/* zoned light: only the section under the pointer turns on */
.lt.lz .on-img{opacity:1;--a1:0;--a2:0;--a3:0;--b1:50%;--b2:300%;transition:--a1 .9s ease,--a2 .9s ease,--a3 .9s ease;
  -webkit-mask-image:linear-gradient(to right,rgba(0,0,0,var(--a1)) 0 calc(var(--b1) - 4.5%),rgba(0,0,0,var(--a2)) calc(var(--b1) + 4.5%) calc(var(--b2) - 4.5%),rgba(0,0,0,var(--a3)) calc(var(--b2) + 4.5%) 100%);
          mask-image:linear-gradient(to right,rgba(0,0,0,var(--a1)) 0 calc(var(--b1) - 4.5%),rgba(0,0,0,var(--a2)) calc(var(--b1) + 4.5%) calc(var(--b2) - 4.5%),rgba(0,0,0,var(--a3)) calc(var(--b2) + 4.5%) 100%)}
@media (prefers-reduced-motion:reduce){.lt .on-img,.lt.lz .on-img{transition:none}}

/* ---------- before/after ---------- */
.ba{position:relative;overflow:hidden;background:#111;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y;cursor:ew-resize}
.ba .knob,.ba .bar{touch-action:none}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.ba .bw{position:absolute;inset:0}
.ba .bar{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#FFFFFF}
.ba .knob{position:absolute;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:24px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.ba .lb{position:absolute;top:14px;font-family:'Noto Sans KR',sans-serif;font-size:12px;letter-spacing:.16em;color:#FFFFFF;background:rgba(0,0,0,.4);padding:4px 10px}
.ba input[type=range]{position:absolute;inset:auto 0 0 0;width:100%;opacity:0;height:1px}
.ba:focus-within .knob{outline:2px solid #C9AE84;outline-offset:3px}

/* ---------- portfolio tile: hover shows logo · name · size ---------- */
.tile{display:block;position:relative;overflow:hidden;text-decoration:none;background:#D8D3CB}
.tile img{display:block;width:100%;transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.tile.fit img{height:100%;object-fit:cover}
.ov{position:absolute;inset:0;background:rgba(20,18,16,.52);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;transition:opacity .8s ease;text-align:center;padding:16px;font-family:'Noto Sans KR',sans-serif;font-weight:300}
.ov>*{transform:translateY(10px);opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .9s ease}
.ov .lg{transition-delay:.05s}
.ov .nm{transition-delay:.15s;font-size:17px;font-weight:400;letter-spacing:.02em}
.ov .ln{width:0;height:1px;background:#FFFFFF;transform:none;transition:width .9s ease .25s,opacity .6s ease .25s}
.ov .py{transition-delay:.3s;font-size:13px;letter-spacing:.16em}
.tile:hover .ov,.tile:focus-visible .ov{opacity:1}
.tile:hover .ov>*,.tile:focus-visible .ov>*{transform:none;opacity:1}
.tile:hover .ov .ln,.tile:focus-visible .ov .ln{width:120px}
.tile:hover img{transform:scale(1.05)}
@media (hover:none){.ov{opacity:1;background:linear-gradient(rgba(0,0,0,0) 55%,rgba(0,0,0,.6));justify-content:flex-end;align-items:flex-start;gap:2px;padding:14px;text-align:left}.ov>*{opacity:1;transform:none}.ov .ln,.ov .lg{display:none}.ov .nm{font-size:14px}.ov .py{font-size:12px}}
@media (prefers-reduced-motion:reduce){.tile img,.ov,.ov>*,.ov .ln{transition:none}}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(150px,(100% - 36px)/4),1fr));gap:12px}
.mid{max-width:1040px;margin-left:auto;margin-right:auto}

/* ---------- common page bits ---------- */
.cols2{columns:2 360px;column-gap:16px}
.cols3{columns:3 260px;column-gap:16px}
.cols2>*,.cols3>*{break-inside:avoid;margin:0 0 16px}
/* 사진 콜라주: 스크립트가 가장 짧은 열에 차례로 넣어 열 높이를 맞춤 (한쪽 열만 비는 것 방지) */
.mz{columns:auto !important;display:flex;align-items:flex-start;gap:16px}
.mason.mz{gap:24px}
.mz>.mcol{flex:1 1 0;min-width:0;margin:0 !important}
.mz>.mcol>*{margin:0 0 16px}
.mason.mz>.mcol>*{margin:0 0 24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,max(440px,(100% - 32px)/3)),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,max(340px,(100% - 40px)/3)),1fr));gap:20px}
.r23{aspect-ratio:2/3}.r43{aspect-ratio:4/3}.r32{aspect-ratio:3/2}.r11{aspect-ratio:1/1}.r34{aspect-ratio:3/4}
.cover{width:100%;object-fit:cover;background:#D8D3CB}
form .f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px 32px}
form label{display:block;font-size:13px;opacity:.75}
form input,form textarea{width:100%;min-height:48px;padding:0;border:0;border-bottom:1px solid currentColor;background:transparent;font:inherit;font-size:16px;color:inherit;border-radius:0}
form textarea{padding:10px 0;resize:vertical}
/* ---------- 개인정보 동의 ---------- */
.consent{margin-top:28px;border:1px solid rgba(128,128,128,.4);font-size:14px}
.consent .crow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 16px}
.consent .call{border-bottom:1px solid rgba(128,128,128,.4);padding:8px 16px;font-weight:500}
.consent label.cb{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;opacity:1;cursor:pointer;flex:1}
.consent label.cb input{width:20px;height:20px;min-height:20px;flex:none;accent-color:#9C7A4E;margin:0}
.consent .tag{font-size:12px;opacity:.7;margin-right:2px}
.consent .cfull{flex:none;min-height:44px;padding:0 4px;border:0;background:none;color:inherit;font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;opacity:.75;cursor:pointer}
.consent .csum{margin:0 16px 12px 46px;font-size:12.5px;line-height:1.8;opacity:.68}
.consent .ci+.ci{border-top:1px dashed rgba(128,128,128,.3)}
.consent .cerr{margin:0;padding:10px 16px;font-size:13px;color:#C0392B;background:rgba(192,57,43,.08)}
.consent.bad{border-color:#C0392B}
#ljDlg{width:min(640px,calc(100% - 32px));max-height:min(80vh,760px);padding:0;border:0;border-radius:6px;background:#FFFFFF;color:#1C1A18;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:'Noto Sans KR',sans-serif}
#ljDlg::backdrop{background:rgba(0,0,0,.55)}
#ljDlg .dh{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:#FFFFFF;border-bottom:1px solid #E6E1D8}
#ljDlg .dh h3{margin:0;font-size:17px;font-weight:500}
#ljDlg .dx{width:44px;height:44px;border:0;background:none;font-size:22px;cursor:pointer;color:#1C1A18}
#ljDlg .db{padding:18px 20px;font-size:14px;line-height:1.9;white-space:normal;color:#3A3530}
#ljDlg .df{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;background:#FFFFFF;border-top:1px solid #E6E1D8}
#ljDlg .df button{min-height:44px;padding:0 18px;border:1px solid #1C1A18;background:#FFFFFF;color:#1C1A18;font:inherit;font-size:14px;cursor:pointer}
#ljDlg .df button.ok{background:#1C1A18;color:#FFFFFF}

/* ---------- A: gallery ---------- */
.A{background:#FFFFFF;color:#1C1A18}
.A .hdr{position:sticky;top:0;z-index:20;background:#FFFFFF;border-bottom:1px solid #E3E0DA}
.A .hdr.over{position:absolute;left:0;right:0;background:transparent;border:0;color:#FFFFFF}
.hdr .in{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 20px;min-height:68px}
.hdr .logo{font-size:15px;letter-spacing:.24em;text-decoration:none;font-weight:400}
.hdr nav{display:flex;flex-wrap:wrap;gap:0 24px;font-size:13px;letter-spacing:.14em}
.hdr nav a{text-decoration:none}
@media (min-width:1800px){.hdr nav{font-size:15px}.hdr .logo{font-size:17px}.D .hdr nav{font-size:17px}}
@media (max-width:560px){.A .hdr nav,.B .hdr nav,.C .hdr nav{gap:0 13px;font-size:12px;letter-spacing:.06em}}
.hdr nav a[aria-current=page]{text-decoration:underline;text-underline-offset:6px}
.A .hero{position:relative;height:92vh;max-height:1300px;min-height:520px;overflow:hidden;background:#2A2724;color:#FFFFFF}
.A .hero .sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;will-change:transform,opacity}
/* 사진을 영상처럼: 확대했다가 줄이면서 시선이 왼쪽에서 오른쪽으로 이동 */
@keyframes kb{0%{transform:translate3d(6%,0,0) scale(1.14)}50%{transform:translate3d(0,0,0) scale(1.24)}100%{transform:translate3d(-6%,0,0) scale(1.14)}}
.A .hero .sl.kb{animation:kb 6s linear infinite alternate}
/* 원본이 작은 사진은 덜 확대해서 흐려짐을 줄임 */
@keyframes kb2{0%{transform:translate3d(2.5%,0,0) scale(1.06)}50%{transform:translate3d(0,0,0) scale(1.1)}100%{transform:translate3d(-2.5%,0,0) scale(1.06)}}
.A .hero .sl.kb2{animation:kb2 6s linear infinite alternate}
@media (prefers-reduced-motion:reduce){.A .hero .sl.kb,.A .hero .sl.kb2{animation:none}}
.A .hero .sl.cur{opacity:1}
.A .hero .shade{position:absolute;inset:0;background:rgba(20,18,16,.3)}
.A .hero .cap{position:absolute;left:0;right:0;bottom:28px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.A .hero h1{margin:0;font-size:clamp(30px,4vw,44px);font-weight:300}
.dots{display:flex;gap:4px}
.dots button{width:36px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;padding:0}
.dots span{display:block;width:26px;height:1px;background:rgba(255,255,255,.5)}
.dots button[aria-current=true] span{background:#FFFFFF}
.A .h2row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid #1C1A18;padding-bottom:14px}
.A h2{margin:0;font-size:clamp(28px,3.2vw,40px);font-weight:300}
.A .muted{color:#6B6358}
.A .sec{padding-top:clamp(80px,10vw,140px)}
.A .intro{display:flex;flex-wrap:wrap;gap:48px;align-items:center}
.A .intro>div:first-child{flex:1 1 320px}
.A .intro>div:last-child{flex:1 1 460px}
.A .strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.A .strip figure{flex:0 0 min(70vw,clamp(300px,21vw,440px));margin:0;scroll-snap-align:start}
.A .btn{display:inline-flex;align-items:center;min-height:52px;padding:0 36px;background:#1C1A18;color:#F2F0EB;text-decoration:none;font-size:13px;letter-spacing:.14em;border:0;cursor:pointer}
.A footer,.B footer,.C footer{margin-top:clamp(80px,10vw,140px);border-top:1px solid currentColor;padding-top:36px;padding-bottom:96px;font-size:13px;line-height:1.9}
.A footer{border-color:#D8D3CB;color:#6B6358}
.filt{display:flex;flex-direction:column}
.filt button{min-height:44px;border:0;background:transparent;text-align:left;cursor:pointer;font-size:14px;padding:0;opacity:.6}
.filt button[aria-pressed=true]{opacity:1;text-decoration:underline;text-underline-offset:6px}

/* ---------- B: night ---------- */
.B{background:#121110;color:#ECE8E1;min-height:100vh}
.B .hdr{position:sticky;top:0;z-index:20;background:rgba(18,17,16,.92);border-bottom:1px solid #2E2B28}
.B .hdr.over{position:absolute;left:0;right:0;background:transparent;border:0}
.B .hero{position:relative;height:94vh;max-height:1300px;min-height:520px}
.B .hero .lt{position:absolute;inset:0;aspect-ratio:auto;height:100%}
.B .hero .txt{position:absolute;left:0;right:0;bottom:40px;pointer-events:none}
.B .hero h1{margin:0;font-size:clamp(34px,5vw,64px);font-weight:300;line-height:1.3}
.B .muted{color:#A39A8E}
.B h2{margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:300}
.B .sec{padding-top:clamp(90px,11vw,160px)}
.B .row{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-end;margin-top:72px;text-decoration:none}
.B .row .img{flex:999 1 560px;max-width:980px}
.B .row .tx{flex:1 1 240px}
.B .row:nth-child(even){flex-direction:row-reverse}
.B .row .nm{font-size:clamp(24px,2.6vw,34px)}
.B .btn{display:inline-flex;align-items:center;min-height:52px;padding:0 36px;border:1px solid #ECE8E1;color:#ECE8E1;background:transparent;text-decoration:none;font-size:13px;letter-spacing:.14em;cursor:pointer}
.B footer{border-color:#2E2B28;color:#A39A8E}

function masonry(el){
  var two=el.classList.contains('cols2'),ms=el.classList.contains('mason'),max=two?2:3,minw=two?360:(ms?300:260),gap=ms?24:16,items=Array.prototype.slice.call(el.children),cur=0;
  function ratio(it){var c=it.className||'',m=/\br(32|43|34|23)\b/.exec(c);if(m)return {32:.667,43:.75,34:1.333,23:1.5}[m[1]];var im=it.tagName==='IMG'?it:it.querySelector('img'),dk=im&&im.getAttribute('data-k'),k=im&&/img\/(\w+)\.jpg/.exec(im.getAttribute('src')||'');return (dk&&DIM[dk])||(k&&DIM[k[1]])||.667;}
  function lay(){
    var w=el.clientWidth;if(!w)return;var n=Math.max(1,Math.min(max,Math.floor((w+gap)/(minw+gap))));if(n===cur)return;cur=n;
    var cw=(w-gap*(n-1))/n,cols=[],hs=[],i;el.textContent='';el.classList.add('mz');
    for(i=0;i<n;i++){var c=document.createElement('div');c.className='mcol';el.appendChild(c);cols.push(c);hs.push(0);}
    items.forEach(function(it){var j=0;for(var k=1;k<n;k++)if(hs[k]<hs[j]-1)j=k;cols[j].appendChild(it);hs[j]+=ratio(it)*cw+gap;});
  }
  lay();if(window.ResizeObserver)new ResizeObserver(lay).observe(el);else window.addEventListener('resize',lay);
}

  if(V[v]&&pg==='home'&&v==='a'){

    function kb(n){var e=sl[n],c=HI[HERO[n][0]]?'kb':'kb2';e.classList.remove(c);void e.offsetWidth;e.classList.add(c);}
    function go(n){if(n!==i)kb(n);i=n;sl.forEach(function(s,j){s.classList.toggle('cur',j===i);});ds.forEach(function(d,j){d.setAttribute('aria-current',j===i);});var p=P[HERO[i][1]];lk.href='#a-'+p.id;lk.textContent=p.name+' '+p.py+' — VIEW PROJECT';}
    ds.forEach(function(d){d.addEventListener('click',function(){go(+d.getAttribute('data-i'));clearInterval(timer);});});
    kb(0);
    timer=setInterval(function(){go((i+1)%sl.length);},3000);
  }
  if(V[v]&&pg==='home'&&v==='c'){
    var links=app.querySelectorAll('.pl a'),imgs=app.querySelectorAll('.split .pic img');
    links.forEach(function(a){function s(){var n=+a.getAttribute('data-i');links.forEach(function(x,j){x.classList.toggle('cur',j===n);});imgs.forEach(function(x,j){x.classList.toggle('cur',j===n);});}a.addEventListener('pointerenter',s);a.addEventListener('focus',s);});
  }
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
applyContent(PREVIEW?{}:(lsGet(LJ_KEY)||{}));
if(!PREVIEW)window.addEventListener('storage',function(e){if(e.key===LJ_KEY){applyContent(lsGet(LJ_KEY)||{});render();}});
render();
</script>
